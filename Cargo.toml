[workspace]
members = [".", "core"]

[package]
name = "cdtw-py"
version = "0.3.0"
edition = "2021"
rust-version = "1.83"
license = "GPL-3.0-only"
publish = false

[lib]
name = "_cdtw"
crate-type = ["cdylib"]

[dependencies]
cdtw-core = { path = "core" }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }

[profile.release]
codegen-units = 1
lto = "fat"
