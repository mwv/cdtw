[workspace]
members = [".", "core"]
# MSRV-aware dependency resolution: only pick versions that build on rust-version
resolver = "3"

[package]
name = "cdtw-py"
version = "0.3.0"
edition = "2021"
# keep in sync with core/Cargo.toml and the msrv job in .github/workflows/ci.yml
rust-version = "1.85"
license = "GPL-3.0-only"
publish = false

[lib]
name = "_cdtw"
crate-type = ["cdylib"]

[dependencies]
cdtw-core = { path = "core" }
numpy = "0.30"
pyo3 = { version = "0.30", features = ["extension-module"] }

[profile.release]
codegen-units = 1
lto = "fat"
