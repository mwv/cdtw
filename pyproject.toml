[build-system]
requires = ["hatchling", "hatch-cython", "Cython>=3", "setuptools", "numpy"]
build-backend = "hatchling.build"

[project]
name = "cdtw"
version = "0.2.0"
description = "Fast dtw in python/cython."
readme = "README.rst"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Maarten Versteegh", email = "maartenversteegh@gmail.com" },
]
keywords = ["cdtw"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Cython",
]
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/mwv/cdtw"

[dependency-groups]
dev = ["pytest"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.pyx" }]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.rst",
    "/HISTORY.rst",
    "/AUTHORS.rst",
    "/CONTRIBUTING.rst",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cdtw"]

[tool.hatch.build.targets.wheel.hooks.cython]

[tool.hatch.build.targets.wheel.hooks.cython.options]
src = "cdtw"
compile_py = false
directives = { boundscheck = false, language_level = 3 }
