[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "cdtw"
version = "0.3.0"
description = "Fast dynamic time warping for speech and other feature sequences."
readme = "README.rst"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Maarten Versteegh", email = "maartenversteegh@gmail.com" },
]
keywords = ["dtw", "dynamic time warping", "speech", "time series"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
]
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/mwv/cdtw"

[dependency-groups]
dev = ["pytest"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "core/Cargo.toml" },
    { file = "**/*.rs" },
]

[tool.maturin]
python-source = "python"
module-name = "cdtw._cdtw"
include = [
    { path = "tests/**/*.py", format = "sdist" },
    { path = "bench/bench.py", format = "sdist" },
    { path = "HISTORY.rst", format = "sdist" },
    { path = "AUTHORS.rst", format = "sdist" },
    { path = "CONTRIBUTING.rst", format = "sdist" },
]
exclude = [{ path = "bench/results/**", format = "sdist" }]
